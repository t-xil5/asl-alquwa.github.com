<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة | أصل القوة للتجارة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f4f6f9;
  --panel: #ffffff;
  --fg: #0f2234;
  --muted: #4a596b;
  --line: #d6dce5;
  --field: #aeb8c7;
  --navy: #092537;
  --gold: #c99821;
  --bad: #b3261e;
  --good: #137a43;
  --font: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.8; }
.wrap { max-width: 860px; margin-inline: auto; padding-inline: 16px; }
.bar { background: #fff; border-bottom: 3px solid var(--gold); }
.barRow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 10px; }
.barRow img { display: block; height: 52px; width: auto; max-width: 100%; }
.barRow a { color: var(--navy); font-weight: 500; }
main { display: grid; gap: 20px; padding-block: 28px 64px; }
.stack { display: grid; gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 22px 20px; min-width: 0; }
h1, h2 { margin: 0; color: var(--navy); font-weight: 700; line-height: 1.4; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.2rem; margin-bottom: 14px; }
p { margin: 0; }
.muted { color: var(--muted); }
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.who { color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
form { display: grid; gap: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; min-width: 0; }
.hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
input[type=text], input[type=email], input[type=password], textarea {
  width: 100%; min-height: 46px; padding: 8px 12px; border: 1px solid var(--field); border-radius: 4px;
  background: #fff; color: var(--fg); font: inherit; font-weight: 400;
}
textarea { min-height: 110px; resize: vertical; }
input[type=file] { font: inherit; font-weight: 400; max-width: 100%; }
.ltr { direction: ltr; text-align: left; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.check input { width: 20px; height: 20px; flex: none; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border-radius: 4px; border: 1.5px solid var(--navy); background: var(--navy); color: #fff; font: 600 1rem/1 var(--font); cursor: pointer; }
.btn:hover { filter: brightness(1.15); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.line { background: #fff; color: var(--navy); }
.btn.sm { min-height: 38px; padding: 0 14px; font-size: .92rem; }
.btn.danger { background: #fff; color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 4px; border: 1px solid var(--line); background: #fff; font-weight: 500; }
.msg.good { border-color: var(--good); color: var(--good); }
.msg.bad { border-color: var(--bad); color: var(--bad); }
.preview { display: block; max-width: 220px; max-height: 160px; width: auto; height: auto; border: 1px solid var(--line); border-radius: 4px; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; padding-top: 0; }
.pinfo { flex: 1 1 220px; min-width: 0; }
.pn { font-weight: 600; color: var(--navy); overflow-wrap: anywhere; }
.pp { color: var(--muted); font-size: .92rem; }
.chip { display: inline-block; padding: 0 10px; border-radius: 3px; border: 1px solid var(--line); font-size: .78rem; font-weight: 600; line-height: 1.7; margin-inline-start: 8px; }
.chip.off { color: var(--muted); background: var(--bg); }
.chip.on { color: var(--good); border-color: var(--good); }
</style>
</head>
<body>

<header class="bar">
  <div class="wrap barRow">
    <img src="logo.jpg" alt="أصل القوة للتجارة">
    <a href="index.html">العودة إلى الموقع</a>
  </div>
</header>

<main class="wrap">
  <div id="msg" class="msg" role="status" aria-live="polite" hidden></div>

  <section class="card" id="notset" hidden>
    <h1>الإعدادات غير مكتملة</h1>
    <p class="muted">افتح ملف config.js وضع عنوان المشروع والمفتاح العام، ثم ارفع الملف من جديد. الخطوات في ملف SETUP-STEPS.txt.</p>
  </section>

  <section class="card" id="login">
    <h1>تسجيل الدخول</h1>
    <form id="loginForm" style="margin-top:14px">
      <label>البريد الإلكتروني
        <input id="email" class="ltr" type="email" autocomplete="username" required>
      </label>
      <label>كلمة المرور
        <input id="password" class="ltr" type="password" autocomplete="current-password" required>
      </label>
      <div class="actions"><button class="btn" id="loginBtn" type="submit">دخول</button></div>
    </form>
  </section>

  <div id="app" class="stack" hidden>
    <section class="card">
      <div class="head">
        <h1>إدارة الأسعار</h1>
        <div class="actions" style="align-items:center">
          <span class="who" id="who"></span>
          <button class="btn line sm" id="logout" type="button">تسجيل الخروج</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">إضافة منتج</h2>
      <form id="pform" novalidate>
        <div class="grid two">
          <label>اسم المنتج
            <input id="pname" type="text" maxlength="200" required>
          </label>
          <label>السعر <span class="hint">بالريال السعودي</span>
            <input id="pprice" class="ltr" type="text" inputmode="decimal" required>
          </label>
        </div>
        <label>الوصف <span class="hint">اختياري، يظهر عند فتح المنتج</span>
          <textarea id="pdesc" maxlength="2000"></textarea>
        </label>
        <div class="grid two">
          <label>الترتيب <span class="hint">الأصغر يظهر أولًا</span>
            <input id="psort" class="ltr" type="text" inputmode="numeric" value="0">
          </label>
          <label class="check" style="align-self:end">
            <input id="pactive" type="checkbox" checked> ظاهر في الموقع
          </label>
        </div>
        <label>الصورة <span class="hint">اختيارية، تظهر فقط عند فتح المنتج</span>
          <input id="pimage" type="file" accept="image/*">
        </label>
        <img id="ppreview" class="preview" alt="معاينة الصورة" hidden>
        <label class="check" id="removeWrap" hidden>
          <input id="premove" type="checkbox"> حذف الصورة الحالية
        </label>
        <div class="actions">
          <button class="btn" id="saveBtn" type="submit">حفظ</button>
          <button class="btn line" id="cancelBtn" type="button" hidden>إلغاء التعديل</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>المنتجات</h2>
      <div id="rows"></div>
    </section>
  </div>
</main>

<script src="config.js"></script>
<script>
/* API:start */
function makeApi(cfg, store, fetchFn) {
  var base = String(cfg.supabaseUrl || '').replace(/\/+$/, '');
  var BUCKET = 'product-images';
  var KEY = 'asl_admin_session';
  var session = null;
  try { session = JSON.parse(store.getItem(KEY) || 'null'); } catch (e) { session = null; }

  function save(s) {
    session = s;
    try { if (s) store.setItem(KEY, JSON.stringify(s)); else store.removeItem(KEY); } catch (e) {}
  }
  function now() { return Math.floor(Date.now() / 1000); }
  function fail(code, status) { var e = new Error(code); e.code = code; e.status = status; return e; }

  async function authCall(path, body, bearer) {
    var headers = { apikey: cfg.supabaseAnonKey, 'Content-Type': 'application/json' };
    if (bearer) headers.Authorization = 'Bearer ' + bearer;
    var res = await fetchFn(base + path, { method: 'POST', headers: headers, body: JSON.stringify(body || {}) });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data: data };
  }
  function adopt(d) {
    save({
      access_token: d.access_token,
      refresh_token: d.refresh_token,
      expires_at: d.expires_at || (now() + (d.expires_in || 3600)),
      email: (d.user && d.user.email) || (session && session.email) || ''
    });
  }
  async function login(email, password) {
    var r = await authCall('/auth/v1/token?grant_type=password', { email: email, password: password });
    if (!r.ok || !r.data || !r.data.access_token) return false;
    adopt(r.data);
    return true;
  }
  async function refresh() {
    if (!session || !session.refresh_token) return false;
    var r = await authCall('/auth/v1/token?grant_type=refresh_token', { refresh_token: session.refresh_token });
    if (!r.ok || !r.data || !r.data.access_token) { save(null); return false; }
    adopt(r.data);
    return true;
  }
  async function token() {
    if (!session) return null;
    if (session.expires_at - 60 <= now()) { if (!(await refresh())) return null; }
    return session.access_token;
  }
  async function call(method, path, headers, body, retried) {
    var t = await token();
    if (!t) throw fail('no-session', 401);
    var h = Object.assign({ apikey: cfg.supabaseAnonKey, Authorization: 'Bearer ' + t }, headers || {});
    var res = await fetchFn(base + path, { method: method, headers: h, body: body });
    if (res.status === 401 && !retried) {
      if (await refresh()) return call(method, path, headers, body, true);
      throw fail('no-session', 401);
    }
    return res;
  }
  async function rows(method, path, obj) {
    var h = { Prefer: 'return=representation' };
    var body;
    if (obj !== undefined) { h['Content-Type'] = 'application/json'; body = JSON.stringify(obj); }
    var res = await call(method, path, h, body);
    if (!res.ok) throw fail('http', res.status);
    var data = [];
    try { data = await res.json(); } catch (e) {}
    return Array.isArray(data) ? data : [];
  }
  function pathFromUrl(u) {
    if (typeof u !== 'string') return null;
    var marker = '/object/public/' + BUCKET + '/';
    var i = u.indexOf(marker);
    if (i < 0) return null;
    try { return decodeURIComponent(u.slice(i + marker.length).split('?')[0]); } catch (e) { return null; }
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  return {
    hasSession: function () { return !!session; },
    email: function () { return (session && session.email) || ''; },
    login: login,
    logout: async function () {
      var t = session && session.access_token;
      save(null);
      if (t) { try { await authCall('/auth/v1/logout', {}, t); } catch (e) {} }
    },
    list: function () { return rows('GET', '/rest/v1/products?select=*&order=sort_order.asc,created_at.desc'); },
    insert: async function (row) {
      var r = await rows('POST', '/rest/v1/products', row);
      if (!r.length) throw fail('not-allowed', 403);
      return r[0];
    },
    update: async function (id, row) {
      var r = await rows('PATCH', '/rest/v1/products?id=eq.' + encodeURIComponent(id), row);
      if (!r.length) throw fail('not-allowed', 403);
      return r[0];
    },
    remove: async function (id) {
      var r = await rows('DELETE', '/rest/v1/products?id=eq.' + encodeURIComponent(id));
      if (!r.length) throw fail('not-allowed', 403);
    },
    uploadImage: async function (blob) {
      var path = uid() + '.jpg';
      var res = await call('POST', '/storage/v1/object/' + BUCKET + '/' + path,
        { 'Content-Type': 'image/jpeg', 'cache-control': 'max-age=31536000' }, blob);
      if (!res.ok) throw fail('upload', res.status);
      return { path: path, url: base + '/storage/v1/object/public/' + BUCKET + '/' + path };
    },
    removeImagePath: async function (path) {
      if (!path) return;
      try { await call('DELETE', '/storage/v1/object/' + BUCKET + '/' + encodeURI(path)); } catch (e) {}
    },
    pathFromUrl: pathFromUrl
  };
}

function normNum(s) {
  return String(s == null ? '' : s)
    .replace(/[٠-٩]/g, function (d) { return String(d.charCodeAt(0) - 0x660); })
    .replace(/[۰-۹]/g, function (d) { return String(d.charCodeAt(0) - 0x6F0); })
    .replace(/٫/g, '.')
    .replace(/[٬،,\s]/g, '');
}
/* API:end */

(function () {
  'use strict';
  var cfg = window.SITE_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  var api = null;
  var editing = null;
  var items = [];

  function say(text, kind) {
    msg.textContent = text || '';
    msg.className = 'msg' + (kind ? ' ' + kind : '');
    msg.hidden = !text;
  }
  function isHttps(u) { return typeof u === 'string' && /^https:\/\//i.test(u); }

  if (!/^https:\/\//.test(String(cfg.supabaseUrl || '')) || !cfg.supabaseAnonKey) {
    $('login').hidden = true;
    $('notset').hidden = false;
    return;
  }
  api = makeApi(cfg, window.localStorage, window.fetch.bind(window));

  function showApp(on) {
    $('login').hidden = on;
    $('app').hidden = !on;
    if (on) { $('who').textContent = api.email(); resetForm(); loadList(); }
  }

  function explain(err, fallback) {
    if (err && err.code === 'no-session') { showApp(false); return 'انتهت الجلسة. سجل الدخول من جديد.'; }
    if (err && err.code === 'not-allowed') return 'ما تم الحفظ. هذا الحساب غير مصرح له بالتعديل. تأكد أن بريدك مكتوب في ملف setup.sql وأنك شغلته.';
    return fallback;
  }

  $('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('loginBtn');
    btn.disabled = true;
    say('');
    try {
      var ok = await api.login($('email').value.trim(), $('password').value);
      if (ok) { $('password').value = ''; showApp(true); }
      else say('البريد أو كلمة المرور غير صحيحة.', 'bad');
    } catch (err) {
      say('تعذر الاتصال. تأكد من الإنترنت وأعد المحاولة.', 'bad');
    }
    btn.disabled = false;
  });

  $('logout').addEventListener('click', async function () {
    await api.logout();
    say('');
    showApp(false);
  });

  function resetForm() {
    editing = null;
    $('pform').reset();
    $('psort').value = '0';
    $('pactive').checked = true;
    $('formTitle').textContent = 'إضافة منتج';
    $('cancelBtn').hidden = true;
    $('removeWrap').hidden = true;
    $('ppreview').hidden = true;
    $('ppreview').removeAttribute('src');
  }
  $('cancelBtn').addEventListener('click', function () { resetForm(); say(''); });

  $('pimage').addEventListener('change', function () {
    var f = this.files && this.files[0];
    var pv = $('ppreview');
    if (f) { pv.src = URL.createObjectURL(f); pv.hidden = false; }
    else if (editing && isHttps(editing.image_url)) { pv.src = editing.image_url; pv.hidden = false; }
    else { pv.hidden = true; pv.removeAttribute('src'); }
  });

  function startEdit(p) {
    editing = p;
    $('pname').value = p.name || '';
    $('pprice').value = String(p.price);
    $('pdesc').value = p.description || '';
    $('psort').value = String(p.sort_order || 0);
    $('pactive').checked = !!p.active;
    $('pimage').value = '';
    $('premove').checked = false;
    var has = isHttps(p.image_url);
    $('removeWrap').hidden = !has;
    if (has) { $('ppreview').src = p.image_url; $('ppreview').hidden = false; }
    else { $('ppreview').hidden = true; $('ppreview').removeAttribute('src'); }
    $('formTitle').textContent = 'تعديل منتج';
    $('cancelBtn').hidden = false;
    say('');
    $('pform').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('pname').focus();
  }

  function renderList() {
    var box = $('rows');
    box.textContent = '';
    if (!items.length) {
      var empty = document.createElement('p');
      empty.className = 'muted';
      empty.textContent = 'ما فيه منتجات بعد. أضف أول منتج من النموذج أعلاه.';
      box.appendChild(empty);
      return;
    }
    items.forEach(function (p) {
      var row = document.createElement('div');
      row.className = 'prow';
      var info = document.createElement('div');
      info.className = 'pinfo';
      var n = document.createElement('div');
      n.className = 'pn';
      n.textContent = p.name;
      var chip = document.createElement('span');
      chip.className = 'chip ' + (p.active ? 'on' : 'off');
      chip.textContent = p.active ? 'ظاهر' : 'مخفي';
      n.appendChild(chip);
      var pp = document.createElement('div');
      pp.className = 'pp';
      pp.textContent = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(Number(p.price)) +
        ' ر.س' + (isHttps(p.image_url) ? ' | فيه صورة' : '');
      info.appendChild(n);
      info.appendChild(pp);

      var actions = document.createElement('div');
      actions.className = 'actions';
      var edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'btn line sm';
      edit.textContent = 'تعديل';
      edit.addEventListener('click', function () { startEdit(p); });
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn danger sm';
      del.textContent = 'حذف';
      del.addEventListener('click', function () {
        if (del.dataset.armed !== '1') {
          del.dataset.armed = '1';
          del.classList.add('armed');
          del.textContent = 'تأكيد الحذف';
          setTimeout(function () {
            del.dataset.armed = '';
            del.classList.remove('armed');
            del.textContent = 'حذف';
          }, 4000);
          return;
        }
        removeItem(p);
      });
      actions.appendChild(edit);
      actions.appendChild(del);
      row.appendChild(info);
      row.appendChild(actions);
      box.appendChild(row);
    });
  }

  async function loadList() {
    try {
      items = await api.list();
      renderList();
    } catch (err) {
      say(explain(err, 'تعذر تحميل المنتجات. تأكد أنك شغلت ملف setup.sql وأن الإعدادات في config.js صحيحة.'), 'bad');
    }
  }

  async function removeItem(p) {
    say('');
    try {
      await api.remove(p.id);
      await api.removeImagePath(api.pathFromUrl(p.image_url));
      if (editing && editing.id === p.id) resetForm();
      say('تم حذف المنتج.', 'good');
      loadList();
    } catch (err) {
      say(explain(err, 'تعذر الحذف. أعد المحاولة.'), 'bad');
    }
  }

  function resizeImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var max = 1000;
        var w = img.naturalWidth, h = img.naturalHeight;
        var s = Math.min(1, max / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, cw, ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { if (b) resolve(b); else reject(new Error('blob')); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  $('pform').addEventListener('submit', async function (e) {
    e.preventDefault();
    say('');
    var name = $('pname').value.trim();
    var priceText = normNum($('pprice').value);
    var sortText = normNum($('psort').value) || '0';
    if (!name) { say('اكتب اسم المنتج.', 'bad'); $('pname').focus(); return; }
    if (!/^\d+(\.\d{1,2})?$/.test(priceText)) { say('اكتب السعر أرقامًا فقط، مثل 150 أو 99.50', 'bad'); $('pprice').focus(); return; }
    if (!/^-?\d{1,6}$/.test(sortText)) { say('الترتيب لازم يكون رقمًا صحيحًا.', 'bad'); $('psort').focus(); return; }

    var btn = $('saveBtn');
    btn.disabled = true;
    var uploaded = null;
    try {
      var oldUrl = editing ? editing.image_url : null;
      var imageUrl = oldUrl || null;
      var file = $('pimage').files && $('pimage').files[0];
      if (file) {
        var blob;
        try { blob = await resizeImage(file); }
        catch (er) { say('تعذر قراءة الصورة. جرّب صورة JPG أو PNG.', 'bad'); btn.disabled = false; return; }
        uploaded = await api.uploadImage(blob);
        imageUrl = uploaded.url;
      } else if (editing && $('premove').checked) {
        imageUrl = null;
      }
      var row = {
        name: name,
        price: Number(priceText),
        description: $('pdesc').value.trim() || null,
        sort_order: parseInt(sortText, 10),
        active: $('pactive').checked,
        image_url: imageUrl
      };
      if (editing) await api.update(editing.id, row);
      else await api.insert(row);
      if (oldUrl && oldUrl !== imageUrl) await api.removeImagePath(api.pathFromUrl(oldUrl));
      uploaded = null;
      resetForm();
      say('تم الحفظ.', 'good');
      loadList();
    } catch (err) {
      if (uploaded) await api.removeImagePath(uploaded.path);
      say(explain(err, 'تعذر الحفظ. تأكد من الإنترنت وأعد المحاولة.'), 'bad');
    }
    btn.disabled = false;
  });

  showApp(api.hasSession());
})();
</script>
</body>
</html>
